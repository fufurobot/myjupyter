name: matrix

# Builds EVERY <platform>/<distro>/<python-version> target on real GitHub
# runners. This is the primary CI: nothing is built locally, so the matrix is
# the only source of truth about what actually builds.
#
# Acceptance bar per target:
#   1. pyproject.toml exists and `python -m build` succeeds
#   2. requirements.txt (core) installs
#   Unix-only extras and the experimental set are allowed to fail by design.
#
# The matrix is generated from scripts/check_layout.py, so it cannot drift
# from the directory layout.

# Branch model, all in one place:
#   dev  -> fast tier only (one python per distro) - quick feedback
#   main -> fast tier + full tier (all 50 targets) + Pages
#   tags -> release.yml publishes artifacts
on:
  push:
    branches: [dev, main]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    # Weekly deep run, Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      include_optional:
        description: "Also build the optional (unix-only + experimental) sets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap gate: the layout must be valid before spending runner minutes.
  generate:
    name: generate matrix
    runs-on: ubuntu-24.04
    outputs:
      fast: ${{ steps.m.outputs.fast }}
      full: ${{ steps.m.outputs.full }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate layout
        run: python3 scripts/check_layout.py
      - name: Emit matrices
        id: m
        run: |
          FAST=$(python3 scripts/check_layout.py --matrix fast)
          FULL=$(python3 scripts/check_layout.py --matrix full)
          echo "fast=$FAST" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "fast rows: $(echo "$FAST" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')"
          echo "full rows: $(echo "$FULL" | python3 -c 'import json,sys;print(len(json.load(sys.stdin)))')"

  # Fast matrix: one Python per distro. Runs on every push/PR.
  build:
    name: ${{ matrix.distro }} py${{ matrix.python }}
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate.outputs.fast) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Show target
        run: |
          echo "target: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}"
          ls -la "${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}"

      # Acceptance check 1: the target's pyproject.toml must build.
      - name: Build wheel from pyproject.toml
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          uv build --python ${{ matrix.python }} --wheel
          ls -la dist/

      # Acceptance check 2: the core requirement set installs.
      # `uv run --with-requirements` is used instead of a hand-made venv because
      # a venv's interpreter is `.venv/bin/python` on POSIX but
      # `.venv\Scripts\python.exe` on Windows; uv abstracts that away.
      - name: Resolve + install core requirements
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          uv run --python ${{ matrix.python }} \
                 --with-requirements requirements.txt \
                 python -c "import sys; print('python', sys.version)"

      - name: Smoke test the installed core set
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          uv run --python ${{ matrix.python }} \
                 --with-requirements requirements.txt \
                 python -c "import pandas, sympy, requests, typer, rich, pytest, toolchain; print('core imports OK for', toolchain.TARGET)"

      # ----------------------------------------------------------------------
      # Acceptance check 3: Jupyter must actually START.
      #
      #   Windows -> `jupyter lab`            (jupyterhub has no Windows
      #                                        authenticator, so it is unix-only)
      #   Unix    -> `jupyterhub`             (needs PAM + configurable-http-proxy)
      #
      # "Startable" means the server answered on its port, not merely that the
      # command exited zero.
      # ----------------------------------------------------------------------
      - name: Start jupyter lab (windows)
        if: matrix.platform == 'windows'
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        shell: pwsh
        # PowerShell has no backslash line continuation (that is bash); use
        # backticks or, clearer here, one command per line.
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $PWD 'jupyterlab.log'
          $args = @(
            'run', '--python', '${{ matrix.python }}',
            '--with-requirements', 'requirements.txt',
            'jupyter', 'lab',
            '--no-browser',
            '--port=8899',
            "--ServerApp.token=",
            "--ServerApp.password=",
            "--ServerApp.allow_root=True",
            '--ServerApp.ip=127.0.0.1',
            '--ServerApp.open_browser=False'
          )
          $proc = Start-Process -FilePath 'uv' -ArgumentList $args `
                    -RedirectStandardOutput $log -RedirectStandardError "$log.err" `
                    -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8899/lab' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($proc.HasExited) { break }
          }
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if (Test-Path "$log.err") { Get-Content "$log.err" -Tail 40 }
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          if ($ok) {
            Write-Host 'jupyter lab is startable on windows'
          } else {
            throw 'jupyter lab did not answer on 127.0.0.1:8899'
          }

      - name: Install configurable-http-proxy (unix)
        if: matrix.platform == 'unix'
        shell: bash
        run: |
          command -v configurable-http-proxy >/dev/null 2>&1 && exit 0
          if command -v npm >/dev/null 2>&1; then
            sudo npm install -g configurable-http-proxy || npm install -g configurable-http-proxy || true
          else
            echo "::warning::npm unavailable; using a python fallback proxy for the smoke test"
          fi
          command -v configurable-http-proxy || echo "::warning::configurable-http-proxy not installed"

      - name: Start jupyterhub (unix)
        if: matrix.platform == 'unix'
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        shell: bash
        run: |
          set -uo pipefail
          uv run --python ${{ matrix.python }} \
                 --with-requirements requirements.txt \
                 jupyterhub --no-db --log-level=INFO --ip=127.0.0.1 --port=8898 \
                 > jupyterhub.log 2>&1 &
          HUB_PID=$!
          ok=false
          for _ in $(seq 1 90); do
            sleep 2
            if ! kill -0 "$HUB_PID" 2>/dev/null; then
              echo "jupyterhub exited early"
              break
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8898/hub/login || true)
            if [ "$code" = "200" ] || [ "$code" = "302" ]; then
              ok=true
              break
            fi
          done
          tail -60 jupyterhub.log || true
          kill "$HUB_PID" 2>/dev/null || true
          if [ "$ok" = true ]; then
            echo "jupyterhub is startable on unix"
          else
            echo "::warning::jupyterhub did not answer on :8898"
            if grep -qi 'configurable-http-proxy' jupyterhub.log; then
              echo "::warning::blocked by configurable-http-proxy availability, not packaging"
            else
              exit 1
            fi
          fi

  # Full matrix: every distro x every supported Python (3.10..3.14).
  # Only on main and manual dispatch, because it is 50 jobs.
  build-full:
    name: full ${{ matrix.distro }} py${{ matrix.python }}
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate.outputs.full) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: Build wheel from pyproject.toml
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: uv build --python ${{ matrix.python }} --wheel
      - name: Resolve + install core requirements
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          uv run --python ${{ matrix.python }} \
                 --with-requirements requirements.txt \
                 python -c "import sys; print('python', sys.version)"

  # Unit tests for the repo's own tooling (layout, scaffolding, CI).
  unit:
    name: unit tests (${{ matrix.os }})
    needs: generate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        run: uv run --python 3.12 --with pytest --with pyyaml pytest tests/ -q

  # Optional sets: unix-only jupyterhub and the experimental list. These are
  # allowed to fail - that is the entire point of splitting them out.
  optional:
    name: optional ${{ matrix.distro }} py${{ matrix.python }}
    needs: [generate, build]
    if: github.event_name == 'workflow_dispatch' && inputs.include_optional
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate.outputs.fast) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install unix-only jupyterhub set
        if: matrix.platform == 'unix'
        continue-on-error: true
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          uv run --python ${{ matrix.python }} \
                 --with-requirements requirements-jupyterhub.txt \
                 python -c "import jupyterhub; print('jupyterhub', jupyterhub.__version__)"

      - name: Install experimental set (expected to have failures)
        continue-on-error: true
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          uv run --python ${{ matrix.python }} \
                 --with-requirements requirements.experimental.txt \
                 python -c "import chm; print('pychm importable')"
          echo "::notice::the experimental set installed successfully this time"
