name: main

# Full test suite. The branch model is:
#   dev  -> fast tests (dev.yml)
#   main -> full tests (this workflow)
#   tags -> release artifacts (release.yml)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep run, Mondays 03:17 UTC (off the hour to avoid the stampede).
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    name: layout + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Validate canonical layout
        run: python3 scripts/check_layout.py
      - name: Run unit tests
        run: uv run --python 3.13 --with pytest pytest tests/ -q
      - name: Emit full matrix
        run: python3 scripts/check_layout.py --matrix full | tee matrix.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-matrix
          path: matrix.json

  # The FULL matrix: every distro x every supported Python version (3.10..3.14).
  # Generated from the single source of truth in scripts/check_layout.py so the
  # matrix can never drift from the validator.
  full:
    name: ${{ matrix.distro }} py${{ matrix.python }}
    needs: layout
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python == '3.10' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: unix, distro: ubuntu, python: "3.10", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: ubuntu, python: "3.11", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: ubuntu, python: "3.12", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: ubuntu, python: "3.13", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: ubuntu, python: "3.14", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: debian, python: "3.10", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: debian, python: "3.11", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: debian, python: "3.12", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: debian, python: "3.13", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: debian, python: "3.14", os: ubuntu-24.04, pm: apt }
          - { platform: unix, distro: archlinux, python: "3.10", os: ubuntu-24.04, pm: pacman }
          - { platform: unix, distro: archlinux, python: "3.11", os: ubuntu-24.04, pm: pacman }
          - { platform: unix, distro: archlinux, python: "3.12", os: ubuntu-24.04, pm: pacman }
          - { platform: unix, distro: archlinux, python: "3.13", os: ubuntu-24.04, pm: pacman }
          - { platform: unix, distro: archlinux, python: "3.14", os: ubuntu-24.04, pm: pacman }
          - { platform: unix, distro: macos, python: "3.10", os: macos-14, pm: brew }
          - { platform: unix, distro: macos, python: "3.11", os: macos-14, pm: brew }
          - { platform: unix, distro: macos, python: "3.12", os: macos-14, pm: brew }
          - { platform: unix, distro: macos, python: "3.13", os: macos-14, pm: brew }
          - { platform: unix, distro: macos, python: "3.14", os: macos-14, pm: brew }
          - { platform: unix, distro: guix, python: "3.14", os: ubuntu-24.04, pm: guix }
          - { platform: unix, distro: nixos, python: "3.14", os: ubuntu-24.04, pm: nix }
          - { platform: windows, distro: winxp, python: "3.10", os: windows-2022, pm: choco }
          - { platform: windows, distro: win7, python: "3.10", os: windows-2022, pm: choco }
          - { platform: windows, distro: win10, python: "3.13", os: windows-2022, pm: choco }
          - { platform: windows, distro: win11, python: "3.13", os: windows-2022, pm: choco }
    steps:
      - uses: actions/checkout@v4

      - name: Configure git ssh
        shell: bash
        run: git config --global core.sshCommand "ssh -F /dev/null"

      - name: Show matrix target
        shell: bash
        run: |
          echo "target=${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}"
          ls -la "${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}"

      - name: Preinstall (unix)
        if: matrix.platform == 'unix'
        shell: bash
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: |
          chmod +x preinstall.sh
          ./preinstall.sh

      - name: Preinstall (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: ${{ matrix.platform }}/${{ matrix.distro }}/${{ matrix.python }}
        run: .\preinstall.ps1 -Force

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install target Python
        shell: bash
        run: uv python install ${{ matrix.python }}

      - name: Validate target directory
        shell: bash
        run: python3 scripts/check_layout.py --quiet

  unit-cross:
    name: unit tests (${{ matrix.os }})
    needs: layout
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run tests
        shell: bash
        run: uv run --python 3.12 --with pytest pytest tests/ -q

  # Publish the docs/dev UI to GitHub Pages, but only from main.
  pages:
    name: GitHub Pages
    needs: layout
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ github.ref }}
