version: 2

# The repo is organised as <platform>/<distro>/<python-version>, and every
# target holds its own requirement files. Dependabot is pointed at a
# representative slice rather than all 50 targets (which would open hundreds of
# duplicate PRs); `.github/workflows/upstream-update.yml` performs the full
# cross-target refresh automatically.
updates:
  # Representative pip targets.
  - package-ecosystem: pip
    directory: "/unix/archlinux/3.14"
    # Dependabot PRs must land on dev, not main.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels: [dependencies, python, archlinux]
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-dev-tooling:
        patterns: ["ruff", "mypy", "flake8", "pylint", "pyright", "pytest*"]

  - package-ecosystem: pip
    directory: "/windows/win11/3.13"
    # Dependabot PRs must land on dev, not main.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, python, windows]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: "/unix/debian/3.14"
    # Dependabot PRs must land on dev, not main.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, python, debian]
    commit-message:
      prefix: "chore(deps)"

  # Keep the workflow actions themselves current.
  - package-ecosystem: github-actions
    directory: "/"
    # Dependabot PRs must land on dev, not main.
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
